// Hexen II on the Miyoo Mini Plus - controls
// This file is read after the game's own settings, so these bindings always win.
// Miyoo buttons as the game sees them: A=SPACE B=CTRL X=SHIFT Y=ALT L1=e R1=t
// L2=TAB R2=BACKSPACE Start=ENTER. In the game, Start opens the game's menu
// and Select is handled by the engine (alone: invuse; Select + Left/Right
// arrive as AUX10/AUX11; let go after them: invselect). X, L1 and Menu are modifiers:
// X + Up/Down/Start and L1 + Left/Right/R1 arrive as AUX1..AUX5, AUX7, and
// Menu + Start / L2 / R2 as ESCAPE (the game's menu) / AUX8 / AUX9. Menu on its
// own is OnionOS's (the Game Switcher); in the game's menus A confirms, B goes back.
unbindall

// interact: +use and impulse 13 ("lift object" in the game's controls menu)
alias +interact "+use; impulse 13"
alias -interact "-use"

bind UPARROW    +forward        // D-pad: walk
bind DOWNARROW  +back
bind LEFTARROW  +left           // D-pad: turn
bind RIGHTARROW +right

bind CTRL       +jump           // B: jump
bind SPACE      +attack         // A: attack
bind ALT        +interact       // Y: interact (doors, levers, lift objects)
bind t          +speed          // R1: run (hold)
bind TAB        "impulse 12"    // L2: previous weapon
bind BACKSPACE  "impulse 10"    // R2: next weapon

bind AUX1       +lookup         // X + Up: look up
bind AUX2       +lookdown       // X + Down: look down
bind AUX3       centerview      // X + Start: look straight ahead
bind AUX4       +moveleft       // L1 + Left: sidestep left
bind AUX5       +moveright      // L1 + Right: sidestep right
bind AUX10      invleft         // Select + Left: previous item
bind AUX11      invright        // Select + Right: next item
bind AUX8       "load quick"    // Menu + L2: quick load
bind AUX9       "save quick"    // Menu + R2: quick save
bind AUX7       +crouch         // L1 + R1: crouch (hold both, in any order)

crosshair 1
showfps 0

// The default (0.02) makes the engine sleep when a frame takes less than 20 ms,
// which on this device holds the game at 50 FPS. With 0 the vsync paces it.
sys_throttle 0
